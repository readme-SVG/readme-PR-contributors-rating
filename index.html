<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate a dynamic SVG badge with your top GitHub pull requests, ranked by repository stars, and embed it into any README.md.">
    <meta name="color-scheme" content="light dark">
    <title>GitHub PR Badge Generator</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gh-bg: #f6f8fa;
            --gh-canvas: #ffffff;
            --gh-canvas-subtle: #f6f8fa;
            --gh-border: #d0d7de;
            --gh-text: #1f2328;
            --gh-muted: #57606a;
            --gh-accent: #0969da;
            --gh-success: #238636;
            --gh-success-hover: #2ea043;
            --gh-btn-bg: #f6f8fa;
            --gh-btn-hover: #f3f4f6;
            --gh-shadow: 0 1px 2px rgba(31, 35, 40, 0.06);
            --gh-focus: rgba(9, 105, 218, 0.3);
            --gh-danger: #cf222e;
            --gh-danger-bg: #ffebe9;
            --gh-danger-border: #ff8182;
        }

        html[data-theme="dark"] {
            --gh-bg: #0d1117;
            --gh-canvas: #161b22;
            --gh-canvas-subtle: #010409;
            --gh-border: #30363d;
            --gh-text: #e6edf3;
            --gh-muted: #8b949e;
            --gh-accent: #2f81f7;
            --gh-success: #238636;
            --gh-success-hover: #2ea043;
            --gh-btn-bg: #21262d;
            --gh-btn-hover: #30363d;
            --gh-shadow: 0 1px 2px rgba(1, 4, 9, 0.4);
            --gh-focus: rgba(47, 129, 247, 0.35);
            --gh-danger: #f85149;
            --gh-danger-bg: #3c1618;
            --gh-danger-border: #f8514966;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background: var(--gh-bg);
            color: var(--gh-text);
            min-height: 100vh;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
        }

        a { color: var(--gh-accent); }

        .header {
            background: var(--gh-canvas);
            border-bottom: 1px solid var(--gh-border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .repo-crumbs {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            font-size: 14px;
        }

        .repo-crumbs svg {
            color: var(--gh-text);
            flex: 0 0 auto;
        }

        .repo-crumb-link {
            color: var(--gh-accent);
            text-decoration: none;
            font-weight: 500;
        }

        .repo-crumb-link.repo-name {
            color: var(--gh-text);
            font-weight: 600;
        }

        .repo-crumb-link:hover { text-decoration: underline; }

        .repo-divider {
            color: var(--gh-muted);
            user-select: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle {
            width: 32px;
            height: 32px;
            border: 1px solid var(--gh-border);
            border-radius: 6px;
            background: var(--gh-btn-bg);
            color: var(--gh-text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .theme-toggle:hover { background: var(--gh-btn-hover); }
        .theme-toggle .icon-sun { display: none; }
        html[data-theme="dark"] .theme-toggle .icon-sun { display: inline; }
        html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

        .lang-select,
        .form-input,
        .btn-copy,
        .btn-primary,
        .order-btn,
        .theme-toggle {
            transition: background-color 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
        }

        .lang-select,
        .form-input,
        .btn-copy,
        .btn-primary {
            appearance: none;
        }

        .lang-select,
        .form-input,
        .btn-copy,
        .btn-primary {
            border-radius: 6px;
            border: 1px solid var(--gh-border);
            font-size: 14px;
        }

        .lang-select,
        .form-input {
            width: 100%;
            background: var(--gh-canvas);
            color: var(--gh-text);
            padding: 7px 10px;
        }

        .lang-select {
            width: auto;
            min-width: 115px;
            cursor: pointer;
        }

        .theme-toggle:focus-visible,
        .lang-select:focus-visible,
        .form-input:focus-visible,
        .btn-copy:focus-visible,
        .btn-primary:focus-visible,
        .order-btn:focus-visible,
        .color-input:focus-visible,
        .color-hex:focus-visible,
        summary:focus-visible {
            outline: none;
            border-color: var(--gh-accent);
            box-shadow: 0 0 0 3px var(--gh-focus);
        }

        @media (max-width: 740px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
                justify-content: space-between;
            }
        }

        .main {
            width: 100%;
            max-width: 1320px;
            margin: 20px auto;
            padding: 0 20px 20px;
            display: grid;
            grid-template-columns: 470px 1fr;
            gap: 20px;
            align-items: start;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .main { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--gh-canvas);
            border: 1px solid var(--gh-border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--gh-shadow);
        }

        .panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--gh-border);
            font-size: 14px;
            font-weight: 600;
            color: var(--gh-text);
            background: var(--gh-canvas-subtle);
        }

        .panel-body { padding: 16px; }

        .config-sections {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .config-section {
            border: 1px solid var(--gh-border);
            border-radius: 8px;
            background: var(--gh-canvas);
            overflow: hidden;
        }

        .config-section summary {
            list-style: none;
            cursor: pointer;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--gh-text);
            background: var(--gh-canvas-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .config-section summary::-webkit-details-marker { display: none; }
        .config-section summary::after {
            content: '▾';
            color: var(--gh-muted);
            font-size: 12px;
            transform: rotate(-90deg);
            transition: transform 0.18s ease;
        }

        .config-section[open] summary::after { transform: rotate(0deg); }
        .section-body { padding: 14px; }

        .form-group { margin-bottom: 14px; }
        .form-group:last-child { margin-bottom: 0; }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--gh-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        @media (max-width: 540px) {
            .form-row { grid-template-columns: 1fr; }
        }

        .form-input:focus,
        .lang-select:focus,
        .color-hex:focus {
            outline: none;
            border-color: var(--gh-accent);
            box-shadow: 0 0 0 3px var(--gh-focus);
        }

        .checkbox-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gh-text);
            font-size: 14px;
        }

        .checkbox-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--gh-success);
        }

        .column-order-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .column-order-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--gh-border);
            border-radius: 6px;
            padding: 8px 10px;
            background: var(--gh-canvas-subtle);
        }

        .column-order-item .checkbox-row {
            gap: 10px;
            margin: 0;
        }

        .order-actions {
            display: inline-flex;
            gap: 6px;
        }

        .order-btn {
            border: 1px solid var(--gh-border);
            background: var(--gh-canvas);
            color: var(--gh-text);
            border-radius: 6px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
        }

        .order-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .color-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-input {
            width: 36px;
            height: 36px;
            border: 1px solid var(--gh-border);
            border-radius: 6px;
            background: var(--gh-canvas);
            cursor: pointer;
            padding: 2px;
        }

        .color-hex {
            width: 100%;
            background: var(--gh-canvas);
            border: 1px solid var(--gh-border);
            border-radius: 6px;
            color: var(--gh-text);
            padding: 8px 10px;
            font-size: 13px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .btn-primary {
            width: 100%;
            padding: 9px 14px;
            background: var(--gh-success);
            border-color: rgba(27, 31, 36, 0.15);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        .btn-primary:hover { background: var(--gh-success-hover); }
        .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }

        .preview-area {
            background: var(--gh-bg);
            border: 1px solid var(--gh-border);
            border-radius: 8px;
            padding: 16px;
            min-height: 220px;
            max-height: 580px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            position: relative;
        }

        /* Checkerboard backdrop so the transparent badge theme stays visible. */
        .preview-area.checkerboard {
            background-image:
                linear-gradient(45deg, var(--gh-border) 25%, transparent 25%, transparent 75%, var(--gh-border) 75%),
                linear-gradient(45deg, var(--gh-border) 25%, transparent 25%, transparent 75%, var(--gh-border) 75%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
        }

        .preview-area img { max-width: 100%; display: block; }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--gh-border);
            border-top-color: var(--gh-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            color: var(--gh-danger);
            font-size: 13px;
            padding: 8px 12px;
            background: var(--gh-danger-bg);
            border: 1px solid var(--gh-danger-border);
            border-radius: 6px;
        }

        .markdown-section { margin-top: 14px; }

        .markdown-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .markdown-header > span {
            font-size: 13px;
            color: var(--gh-muted);
            font-weight: 600;
        }

        .markdown-actions {
            display: inline-flex;
            gap: 8px;
        }

        .btn-copy {
            background: var(--gh-btn-bg);
            color: var(--gh-text);
            padding: 6px 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-copy:hover { background: var(--gh-btn-hover); }
        .btn-copy:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-copy.copied { background: #1f883d; color: #fff; border-color: #1f883d; }

        .code-block {
            background: var(--gh-canvas-subtle);
            border: 1px solid var(--gh-border);
            border-radius: 8px;
            padding: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px;
            color: var(--gh-text);
            word-break: break-all;
            line-height: 1.5;
        }

        .footer {
            border-top: 1px solid var(--gh-border);
            background: var(--gh-canvas);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-size: 13px;
            color: var(--gh-muted);
        }

        .footer a {
            color: var(--gh-muted);
            text-decoration: none;
        }

        .footer a:hover {
            color: var(--gh-accent);
            text-decoration: underline;
        }
    </style>
</head>
<body>
<header class="header">
    <div class="repo-crumbs">
        <svg aria-hidden="true" height="24" viewBox="0 0 16 16" version="1.1" width="24" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8a8.013 8.013 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 4.84c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path>
        </svg>
        <a class="repo-crumb-link" href="https://github.com/readme-SVG" target="_blank" rel="noreferrer">readme-SVG</a>
        <span class="repo-divider">/</span>
        <a class="repo-crumb-link repo-name" href="https://github.com/readme-SVG/readme-pr-contributors-rating" target="_blank" rel="noreferrer">readme-pr-contributors-rating</a>
    </div>
    <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">
            <svg class="icon-moon" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M9.598 1.591a.75.75 0 0 1 .785.175 6.5 6.5 0 1 0 3.851 5.968.75.75 0 0 1 1.464-.28 8 8 0 1 1-6.315-7.863.75.75 0 0 1 .215 1.44Z"></path></svg>
            <svg class="icon-sun" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 10.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM8 0a.75.75 0 0 1 .75.75V2a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0Zm0 14a.75.75 0 0 1 .75.75V16a.75.75 0 0 1-1.5 0v-1.25A.75.75 0 0 1 8 14Zm8-6a.75.75 0 0 1-.75.75H14a.75.75 0 0 1 0-1.5h1.25A.75.75 0 0 1 16 8ZM2 8a.75.75 0 0 1-.75.75H0a.75.75 0 0 1 0-1.5h1.25A.75.75 0 0 1 2 8Zm11.03 4.28a.75.75 0 0 1 1.06 1.06l-.884.884a.75.75 0 1 1-1.06-1.06l.884-.884ZM3.914 2.166a.75.75 0 0 1 1.06 0l.884.884a.75.75 0 1 1-1.06 1.06l-.884-.884a.75.75 0 0 1 0-1.06Zm9.176 0a.75.75 0 0 1 0 1.06l-.884.884a.75.75 0 0 1-1.06-1.06l.884-.884a.75.75 0 0 1 1.06 0ZM3.03 12.28a.75.75 0 0 1 0 1.06l-.884.884a.75.75 0 1 1-1.06-1.06l.884-.884a.75.75 0 0 1 1.06 0Z"></path></svg>
        </button>
        <select class="lang-select" id="langSelect" aria-label="Interface language">
            <option value="en">English</option>
            <option value="zh-CN">中文</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="pt">Português</option>
            <option value="ru">Русский</option>
            <option value="ja">日本語</option>
            <option value="de">Deutsch</option>
            <option value="uk">Українська</option>
            <option value="pl">Polski</option>
            <option value="nl">Nederlands</option>
            <option value="kk">Қазақша</option>
            <option value="sv">Svenska</option>
            <option value="cs">Čeština</option>
        </select>
    </div>
</header>

<main class="main">
    <section class="panel" aria-labelledby="configPanelHeader">
        <div class="panel-header" id="configPanelHeader" data-i18n="configTitle">Configuration</div>
        <div class="panel-body">
            <div class="config-sections">
                <details class="config-section" open>
                    <summary>General</summary>
                    <div class="section-body">
                        <div class="form-group">
                            <label class="form-label" for="username" data-i18n="usernameLabel">GitHub Username</label>
                            <input class="form-input" type="text" id="username" placeholder="username" value="OstinUA" autocomplete="off" spellcheck="false" maxlength="39">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="limit" data-i18n="limitLabel">Number of PRs</label>
                                <input class="form-input" type="number" id="limit" value="7" min="1" max="15">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="themePreset" data-i18n="themeLabel">Theme</label>
                                <select class="form-input" id="themePreset">
                                    <option value="dark">GitHub Dark</option>
                                    <option value="light">GitHub Light</option>
                                    <option value="dimmed">GitHub Dimmed</option>
                                    <option value="night">Night Blue</option>
                                    <option value="transparent">Transparent</option>
                                    <option value="custom">Custom</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="customTitle" data-i18n="customTitleLabel">Custom title</label>
                            <input class="form-input" type="text" id="customTitle" placeholder="Leave empty for default" maxlength="80">
                        </div>

                        <div class="checkbox-stack">
                            <div class="checkbox-row">
                                <input type="checkbox" id="uniqueRepos">
                                <label for="uniqueRepos" data-i18n="uniqueReposLabel">Show only unique repositories</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="showRejected">
                                <label for="showRejected" data-i18n="showRejectedLabel">Show rejected PRs</label>
                            </div>
                        </div>

                        <div class="form-group" style="margin-top:14px;">
                            <label class="form-label" for="repoNameFormat" data-i18n="repoNameFormatLabel">Repository name format</label>
                            <select class="form-input" id="repoNameFormat">
                                <option value="full" data-i18n="repoNameFormatFull">Full Name (owner/repo)</option>
                                <option value="short" data-i18n="repoNameFormatShort">Short Name (repo)</option>
                            </select>
                        </div>
                    </div>
                </details>

                <details class="config-section">
                    <summary>Columns</summary>
                    <div class="section-body">
                        <div class="form-group">
                            <label class="form-label" data-i18n="columnOrderLabel">Column Order</label>
                            <div class="column-order-list" id="columnOrderList"></div>
                        </div>
                    </div>
                </details>

                <details class="config-section">
                    <summary>Dimensions</summary>
                    <div class="section-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="repoWidth" data-i18n="repoWidthLabel">Repo Width</label>
                                <input class="form-input" type="number" id="repoWidth" value="180" min="60" max="500">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="langWidth" data-i18n="langWidthLabel">Language Width</label>
                                <input class="form-input" type="number" id="langWidth" value="80" min="60" max="300">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="prWidth" data-i18n="prWidthLabel">PR Width</label>
                                <input class="form-input" type="number" id="prWidth" value="320" min="100" max="900">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="dateWidth" data-i18n="dateWidthLabel">Date Width</label>
                                <input class="form-input" type="number" id="dateWidth" value="90" min="60" max="300">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="changesWidth" data-i18n="changesWidthLabel">Changes Width</label>
                                <input class="form-input" type="number" id="changesWidth" value="100" min="70" max="300">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="starsWidth" data-i18n="starsWidthLabel">Stars Width</label>
                                <input class="form-input" type="number" id="starsWidth" value="60" min="50" max="240">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="badgeWidth" data-i18n="badgeWidthLabel">Badge width</label>
                                <input class="form-input" type="number" id="badgeWidth" value="830" min="700" max="1400">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="rowHeight" data-i18n="rowHeightLabel">Row height</label>
                                <input class="form-input" type="number" id="rowHeight" value="40" min="30" max="60">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="previewHeight" data-i18n="previewHeightLabel">Preview window height</label>
                            <input class="form-input" type="number" id="previewHeight" value="220" min="120" max="580">
                        </div>
                    </div>
                </details>

                <details class="config-section">
                    <summary>Colors</summary>
                    <div class="section-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="bgColor" data-i18n="bgColorLabel">Background</label>

<script src="./i18n/pt.js"></script>
<script src="./i18n/ru.js"></script>
<script src="./i18n/ja.js"></script>
<script src="./i18n/de.js"></script>
<script src="./i18n/uk.js"></script>
<script src="./i18n/pl.js"></script>
<script src="./i18n/nl.js"></script>
<script src="./i18n/kk.js"></script>
<script src="./i18n/sv.js"></script>
<script src="./i18n/cs.js"></script>

<script>
(() => {
    'use strict';

    // -----------------------------------------------------------------------
    // Constants and small helpers
    // -----------------------------------------------------------------------

    const i18n = window.__I18N;
    const CONFIG_STORAGE_KEY = 'badge-generator:config:v1';
    const LANG_STORAGE_KEY = 'badge-generator:lang';
    const THEME_STORAGE_KEY = 'badge-generator:ui-theme';
    const PROJECT_URL = 'https://github.com/readme-SVG/readme-pr-contributors-rating';

    /** How long to wait for the badge preview before reporting a failure. */
    const PREVIEW_TIMEOUT_MS = 15000;

    /** Server-side defaults; only non-default values end up in the URL. */
    const DEFAULTS = {
        username: 'OstinUA',
        limit: '7',
        badgeWidth: '830',
        rowHeight: '40',
        repoWidth: '180',
        langWidth: '80',
        prWidth: '320',
        dateWidth: '90',
        changesWidth: '100',
        starsWidth: '60',
        previewHeight: '220',
        repoNameFormat: 'full',
        themePreset: 'dark'
    };

    const COLOR_NAMES = ['bg', 'text', 'title', 'muted', 'star', 'border', 'shadow'];

    const THEME_PRESETS = {
        dark: { bg: '0d1117', text: 'c9d1d9', title: '58a6ff', muted: '8b949e', star: 'e3b341', border: '30363d', shadow: '000000' },
        light: { bg: 'ffffff', text: '24292f', title: '0969da', muted: '57606a', star: 'bf8700', border: 'd0d7de', shadow: '000000' },
        dimmed: { bg: '22272e', text: 'adbac7', title: '539bf5', muted: '768390', star: 'd29922', border: '444c56', shadow: '000000' },
        night: { bg: '0b1320', text: 'd8e5ff', title: '4ea1ff', muted: '89a4d6', star: 'ffd166', border: '1d3557', shadow: '000000' },
        transparent: { bg: '000000', text: 'ffffff', title: 'ffffff', muted: 'd1d5db', star: 'ffd166', border: '000000', shadow: '000000', transparent: true }
    };

    /** Maps a column key to the i18n key of its checkbox label. */
    const COLUMN_LABEL_KEYS = {
        pr: 'showPullsLabel',
        date: 'showDateLabel',
        lang: 'showLangLabel',
        changes: 'showChangesLabel'
    };

    const $ = (id) => document.getElementById(id);

    // Fail fast when a locale file is broken or out of sync with the schema.
    window.validateI18nIntegrity();

    // -----------------------------------------------------------------------
    // UI theme (light / dark chrome of the configurator itself)
    // -----------------------------------------------------------------------

    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

    function initUiTheme() {
        const saved = localStorage.getItem(THEME_STORAGE_KEY);
        const theme = saved === 'dark' || saved === 'light' ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
    }

    function toggleUiTheme() {
        const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem(THEME_STORAGE_KEY, next);
    }

    // -----------------------------------------------------------------------
    // Column order state
    // -----------------------------------------------------------------------

    let columnOrderState = [
        { key: 'pr', enabled: true },
        { key: 'date', enabled: true },
        { key: 'lang', enabled: false },
        { key: 'changes', enabled: false }
    ];

    function moveColumn(key, direction) {
        const index = columnOrderState.findIndex((item) => item.key === key);
        const target = index + direction;
        if (index < 0 || target < 0 || target >= columnOrderState.length) return;
        const [item] = columnOrderState.splice(index, 1);
        columnOrderState.splice(target, 0, item);
        renderColumnOrderList();
    }

    function renderColumnOrderList() {
        const list = $('columnOrderList');
        list.textContent = '';

        columnOrderState.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'column-order-item';

            const left = document.createElement('div');
            left.className = 'checkbox-row';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = `col-${item.key}`;
            checkbox.checked = item.enabled;
            checkbox.addEventListener('change', (event) => {
                item.enabled = event.target.checked;
            });

            const label = document.createElement('label');
            label.setAttribute('for', checkbox.id);
            label.textContent = i18n[currentLang][COLUMN_LABEL_KEYS[item.key]] || item.key;

            left.append(checkbox, label);

            const actions = document.createElement('div');
            actions.className = 'order-actions';

            const upButton = document.createElement('button');
            upButton.type = 'button';
            upButton.className = 'order-btn';
            upButton.textContent = '▲';
            upButton.disabled = index === 0;
            upButton.addEventListener('click', () => moveColumn(item.key, -1));

            const downButton = document.createElement('button');
            downButton.type = 'button';
            downButton.className = 'order-btn';
            downButton.textContent = '▼';
            downButton.disabled = index === columnOrderState.length - 1;
            downButton.addEventListener('click', () => moveColumn(item.key, 1));

            actions.append(upButton, downButton);
            row.append(left, actions);
            list.appendChild(row);
        });
    }

    // -----------------------------------------------------------------------
    // Internationalization
    // -----------------------------------------------------------------------

    let currentLang = 'en';

    function switchLanguage(lang) {
        if (!i18n[lang]) return;
        currentLang = lang;
        localStorage.setItem(LANG_STORAGE_KEY, lang);
        document.documentElement.setAttribute('lang', lang);
        document.title = i18n[lang].title;
        document.querySelectorAll('[data-i18n]').forEach((element) => {
            const key = element.getAttribute('data-i18n');
            if (i18n[lang][key]) element.textContent = i18n[lang][key];
        });
        renderColumnOrderList();
    }

    // -----------------------------------------------------------------------
    // Badge theme presets and color inputs
    // -----------------------------------------------------------------------

    function setColor(name, value) {
        $(`${name}Color`).value = value;
        $(`${name}ColorPicker`).value = `#${value}`;
    }

    function applyThemePreset(name) {
        const preset = THEME_PRESETS[name];
        if (!preset) return;
        COLOR_NAMES.forEach((color) => setColor(color, preset[color] || '000000'));
        $('previewArea').classList.toggle('checkerboard', Boolean(preset.transparent));
    }

    function setupColorSync(name) {
        const picker = $(`${name}ColorPicker`);
        const hex = $(`${name}Color`);

        const markCustom = () => {
            $('themePreset').value = 'custom';
            $('previewArea').classList.remove('checkerboard');
        };

        picker.addEventListener('input', () => {
            hex.value = picker.value.substring(1);
            markCustom();
        });
        hex.addEventListener('input', () => {
            const normalized = hex.value.replace(/[^a-fA-F0-9]/g, '').slice(0, 6);
            hex.value = normalized;
            if (normalized.length === 6) picker.value = `#${normalized}`;
            markCustom();
        });
    }

    // -----------------------------------------------------------------------
    // Configuration persistence (localStorage)
    // -----------------------------------------------------------------------

    const CONFIG_FIELDS = [
        'username', 'limit', 'customTitle', 'repoNameFormat', 'themePreset',
        'repoWidth', 'langWidth', 'prWidth', 'dateWidth', 'changesWidth',
        'starsWidth', 'badgeWidth', 'rowHeight', 'previewHeight'
    ];

    function collectConfig() {
        const config = {};
        CONFIG_FIELDS.forEach((field) => {
            config[field] = $(field).value;
        });
        COLOR_NAMES.forEach((color) => {
            config[`${color}Color`] = $(`${color}Color`).value;
        });
        config.uniqueRepos = $('uniqueRepos').checked;
        config.showRejected = $('showRejected').checked;
        config.columns = columnOrderState.map((item) => ({ ...item }));
        return config;
    }

    function applyConfig(config) {
        if (!config || typeof config !== 'object') return;

        CONFIG_FIELDS.forEach((field) => {
            if (typeof config[field] === 'string' || typeof config[field] === 'number') {
                $(field).value = String(config[field]);
            }
        });
        COLOR_NAMES.forEach((color) => {
            const value = config[`${color}Color`];
            if (typeof value === 'string' && /^[a-fA-F0-9]{6}$/.test(value)) {
                setColor(color, value);
            }
        });
        $('uniqueRepos').checked = Boolean(config.uniqueRepos);
        $('showRejected').checked = Boolean(config.showRejected);

        if (Array.isArray(config.columns) && config.columns.length === columnOrderState.length) {
            const known = new Set(columnOrderState.map((item) => item.key));
            const restored = config.columns.filter((item) => item && known.has(item.key));
            if (new Set(restored.map((item) => item.key)).size === known.size) {
                columnOrderState = restored.map((item) => ({ key: item.key, enabled: Boolean(item.enabled) }));
            }
        }

        applyThemePreset($('themePreset').value);
    }

    function saveConfig() {
        try {
            localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(collectConfig()));
        } catch (error) {
            // Storage can be unavailable (private mode, quota); persistence is
            // a convenience, so failures are intentionally ignored.
        }
    }

    function restoreConfig() {
        try {
            const raw = localStorage.getItem(CONFIG_STORAGE_KEY);
            if (raw) applyConfig(JSON.parse(raw));
        } catch (error) {
            localStorage.removeItem(CONFIG_STORAGE_KEY);
        }
    }

    // -----------------------------------------------------------------------
    // Badge URL construction
    // -----------------------------------------------------------------------

    function buildBadgeParams() {
        const enabledByKey = Object.fromEntries(columnOrderState.map((item) => [item.key, item.enabled]));
        const params = new URLSearchParams();

        const username = $('username').value.trim() || DEFAULTS.username;
        params.set('username', username);

        const setIfNotDefault = (param, elementId, defaultValue) => {
            const value = $(elementId).value;
            if (value !== '' && value !== defaultValue) params.set(param, value);
        };

        setIfNotDefault('limit', 'limit', DEFAULTS.limit);
        params.set('show_pr', enabledByKey.pr ? 'true' : 'false');
        params.set('show_date', enabledByKey.date ? 'true' : 'false');
        params.set('show_lang', enabledByKey.lang ? 'true' : 'false');
        params.set('show_changes', enabledByKey.changes ? 'true' : 'false');
        if ($('uniqueRepos').checked) params.set('unique_repos', 'true');
        if ($('showRejected').checked) params.set('show_rejected', 'true');
        if ($('repoNameFormat').value !== DEFAULTS.repoNameFormat) params.set('repo_name_format', $('repoNameFormat').value);
        params.set('col_order', columnOrderState.map((item) => item.key).join(','));

        setIfNotDefault('badge_width', 'badgeWidth', DEFAULTS.badgeWidth);
        setIfNotDefault('row_height', 'rowHeight', DEFAULTS.rowHeight);
        setIfNotDefault('repo_width', 'repoWidth', DEFAULTS.repoWidth);
        setIfNotDefault('lang_width', 'langWidth', DEFAULTS.langWidth);
        setIfNotDefault('pr_width', 'prWidth', DEFAULTS.prWidth);
        setIfNotDefault('date_width', 'dateWidth', DEFAULTS.dateWidth);
        setIfNotDefault('changes_width', 'changesWidth', DEFAULTS.changesWidth);
        setIfNotDefault('stars_width', 'starsWidth', DEFAULTS.starsWidth);

        const customTitle = $('customTitle').value.trim();
        if (customTitle) params.set('custom_title', customTitle);

        const dark = THEME_PRESETS.dark;
        const colorParams = {
            bg_color: ['bgColor', dark.bg],
            text_color: ['textColor', dark.text],
            title_color: ['titleColor', dark.title],
            muted_color: ['mutedColor', dark.muted],
            star_color: ['starColor', dark.star],
            border_color: ['borderColor', dark.border],
            shadow_color: ['shadowColor', '000000']
        };
        Object.entries(colorParams).forEach(([param, [elementId, defaultValue]]) => {
            const value = $(elementId).value;
            if (value !== defaultValue) params.set(param, value);
        });

        if ($('themePreset').value === 'transparent') params.set('transparent', 'true');

        return params;
    }

    function buildBadgeUrl() {
        return `${window.location.origin}/api/badge?${buildBadgeParams().toString()}`;
    }

    // -----------------------------------------------------------------------
    // Preview, markdown output, downloads
    // -----------------------------------------------------------------------

    let currentBadgeUrl = null;
    /** Monotonic id of the newest preview request; older probes are ignored. */
    let previewRequestId = 0;

    function clearPreviewError() {
        const existing = $('previewError');
        if (existing) existing.remove();
    }

    function showPreviewError() {
        clearPreviewError();
        const error = document.createElement('div');
        error.className = 'error-msg';
        error.id = 'previewError';
        error.setAttribute('role', 'alert');
        error.textContent = i18n[currentLang].errorFetch;
        $('previewArea').appendChild(error);
    }

    function generate() {
        const url = buildBadgeUrl();
        const badge = $('badge');
        const spinner = $('spinner');
        const placeholder = $('previewPlaceholder');
        const button = $('generateBtn');

        badge.style.display = 'none';
        placeholder.style.display = 'none';
        spinner.style.display = 'block';
        button.disabled = true;
        clearPreviewError();

        currentBadgeUrl = url;
        $('markdownCode').textContent = `[![Top PRs](${url})](${PROJECT_URL})`;
        $('copyBtn').disabled = false;
        $('downloadBtn').disabled = false;

        // Load into a detached image first so a failing request never leaves a
        // broken image in the preview. The cache-buster guarantees the preview
        // reflects the latest server-side data on every regeneration.
        const requestId = (previewRequestId += 1);
        let timeoutId = 0;

        const settle = (loaded) => () => {
            // A slow earlier request must not overwrite a newer one.
            if (requestId !== previewRequestId) return;
            clearTimeout(timeoutId);

            if (loaded) {
                badge.src = probe.src;
                badge.style.display = 'block';
            } else {
                placeholder.style.display = 'inline';
                showPreviewError();
            }
            spinner.style.display = 'none';
            button.disabled = false;
        };

        const probe = new Image();
        probe.addEventListener('load', settle(true));
        probe.addEventListener('error', settle(false));

        // Watchdog: a request that neither resolves nor fails (stalled
        // connection, blocked by an extension) must not pin the UI to the
        // spinner and leave the button disabled forever.
        timeoutId = setTimeout(settle(false), PREVIEW_TIMEOUT_MS);

        probe.src = `${url}&_=${Date.now()}`;

        saveConfig();
    }

    async function copyMarkdown() {
        const text = $('markdownCode').textContent;
        if (!text || text === '-') return;

        const button = $('copyBtn');
        const label = button.querySelector('[data-i18n="copyBtn"]');
        let copied = false;

        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                copied = true;
            }
        } catch (error) {
            copied = false;
        }

        if (!copied) {
            // Fallback for insecure contexts and older browsers.
            const scratch = document.createElement('textarea');
            scratch.value = text;
            scratch.setAttribute('readonly', '');
            scratch.style.position = 'fixed';
            scratch.style.opacity = '0';
            document.body.appendChild(scratch);
            scratch.select();
            try {
                copied = document.execCommand('copy');
            } catch (error) {
                copied = false;
            }
            scratch.remove();
        }

        if (!copied) return;

        label.textContent = i18n[currentLang].copiedBtn;
        button.classList.add('copied');
        setTimeout(() => {
            label.textContent = i18n[currentLang].copyBtn;
            button.classList.remove('copied');
        }, 2000);
    }

    async function downloadSvg() {
        if (!currentBadgeUrl) return;
        try {
            const response = await fetch(currentBadgeUrl);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const blob = await response.blob();
            const objectUrl = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = objectUrl;
            anchor.download = 'top-pr-contributions.svg';
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            URL.revokeObjectURL(objectUrl);
        } catch (error) {
            showPreviewError();
        }
    }

    // -----------------------------------------------------------------------
    // Preview window sizing
    // -----------------------------------------------------------------------

    function updatePreviewWindowSize() {
        const parsed = Number.parseInt($('previewHeight').value, 10);
        const height = Number.isFinite(parsed) ? Math.min(580, Math.max(120, parsed)) : 220;
        $('previewArea').style.minHeight = `${height}px`;
    }

    // -----------------------------------------------------------------------
    // Wiring
    // -----------------------------------------------------------------------

    function init() {
        initUiTheme();

        const savedLang = localStorage.getItem(LANG_STORAGE_KEY);
        $('langSelect').value = i18n[savedLang] ? savedLang : 'en';

        COLOR_NAMES.forEach(setupColorSync);
        restoreConfig();
        switchLanguage($('langSelect').value);
        updatePreviewWindowSize();

        $('themeToggle').addEventListener('click', toggleUiTheme);
        $('langSelect').addEventListener('change', (event) => switchLanguage(event.target.value));
        $('themePreset').addEventListener('change', (event) => {
            applyThemePreset(event.target.value);
            saveConfig();
        });
        $('generateBtn').addEventListener('click', generate);
        $('copyBtn').addEventListener('click', copyMarkdown);
        $('downloadBtn').addEventListener('click', downloadSvg);
        $('previewHeight').addEventListener('input', updatePreviewWindowSize);

        // Persist the configuration whenever any control settles, so a reload
        // never loses work in progress.
        document.querySelectorAll('.panel input, .panel select').forEach((element) => {
            element.addEventListener('change', saveConfig);
        });

        // Allow regenerating with Enter inside the username field.
        $('username').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') generate();
        });
    }

    init();
})();
</script>
</body>
</html>
