name: Lint and Static Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Lint JavaScript and validate i18n schema
        run: npm run lint

      - name: Validate JavaScript syntax (api/)
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find api -type f -name '*.js' -print0)

      - name: Validate Python syntax (scripts/)
        run: python -m compileall -q scripts
